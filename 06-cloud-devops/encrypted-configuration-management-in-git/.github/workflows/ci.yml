name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the package and the test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch the sops and age binaries
        run: bash scripts/fetch_tools.sh

      - name: Run the test suite
        run: pytest -q

      - name: Run the end-to-end check against the real binaries
        run: bash scripts/real_e2e.sh

  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the package and the test extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Ansible
        run: pip install ansible-core

      - name: Fetch the sops and age binaries
        run: bash scripts/fetch_tools.sh

      - name: Scaffold a throwaway environment for the playbook
        run: |
          python -m secretsync init --envs dev --force
          mkdir -p ansible/secrets
          cp environments/dev/secrets.enc.yaml ansible/secrets/dev.secrets.enc.yaml

      - name: Run the playbook
        env:
          CI: "true"
          SECRETSYNC_RUN_ID: "github-actions"
          SOPS_AGE_KEY_FILE: .secretsync/local-keys/dev.key
          ANSIBLE_LOOKUP_PLUGINS: ansible/lookup_plugins
        run: ansible-playbook -i ansible/inventory/ci.yml ansible/playbook.yml
