name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the dependencies
        run: pip install -r requirements.txt
      - name: Lint the source
        run: python -m compileall -q src main.py
      - name: Run the tests
        run: pytest -q
