# k3s/config.yaml - K3s SERVER configuration.
#
# K3s reads this file when started with --config (or K3S_CONFIG_FILE set by
# the install scripts in bootstrap/). Command-line flags override these keys.
#
# Placeholders use ${VAR} syntax and are substituted at install time by the
# bootstrap scripts; none of them is a secret. The node-token is generated by
# K3s itself into /var/lib/rancher/k3s/server/node-token (mode 0600) and is
# never stored in this file.
#
# Reference: https://docs.k3s.io/cli/server

# Embedded etcd datastore. `cluster-init` on the first server bootstraps the
# etcd cluster; additional servers join the same datastore.
datastore:
  endpoint: "etcd"
cluster-init: true

# Extra TLS subject alternate names. Add every API VIP, DNS name and IP that
# clients (and joining agents/servers) will use to reach the API. Substitute
# the real values for your environment.
tls-san:
  - "${K3S_TLS_SAN_1:-k3s-api.edge.local}"
  - "${K3S_TLS_SAN_2:-127.0.0.1}"

# Advertise and bind the API on the node's primary address.
node-ip: "${K3S_NODE_IP:-}"
https-listen-port: 6443

# Disable components we replace with our own stack on edge nodes. Traefik and
# the built-in service load balancer are the usual ones to drop.
disable:
  - traefik
  - servicelb

# Avoid spinning up a cloud-controller; edge nodes have no cloud provider.
disable-cloud-controller: true

# kubelet tuning for small nodes: reserve resources and keep the eviction
# thresholds sensible so a busy pod cannot wedge the node.
kubelet-arg:
  - "eviction-hard=memory.available<200Mi,nodefs.available<10%"
  - "system-reserved=cpu=100m,memory=128Mi"
  - "kube-reserved=cpu=100m,memory=128Mi"

# Write the kubeconfig readable only by root by default.
write-kubeconfig-mode: "0600"

# etcd snapshot cadence is handled by systemd/k3s-backup.timer, but keep
# K3s's own retention count aligned so both agree.
etcd-snapshot-retention: 5
etcd-snapshot-schedule-cron: "0 */6 * * *"

# Labels applied to this server node. Keep node-class consistent with agents.
node-label:
  - "node-class=vm"
  - "edge-role=server"
