{{- if .Values.cache.enabled }}
{{/*
Cache StatefulSet (Redis-compatible). Same edge placement rules as Postgres:
local-path storage, node affinity on node-class, topology spread.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "edge-stateful.fullname" . }}-cache
  labels:
    {{- include "edge-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  serviceName: {{ include "edge-stateful.fullname" . }}-cache-headless
  replicas: {{ .Values.cache.replicas }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "edge-stateful.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "edge-stateful.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cache
    spec:
      serviceAccountName: {{ include "edge-stateful.serviceAccountName" . }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-class
                    operator: In
                    values:
                      {{- range .Values.placement.nodeClasses }}
                      - {{ . | quote }}
                      {{- end }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.placement.maxSkew }}
          topologyKey: {{ .Values.placement.topologyKey }}
          whenUnsatisfiable: {{ .Values.placement.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "edge-stateful.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: cache
      containers:
        - name: cache
          image: "{{ .Values.cache.image.repository }}:{{ .Values.cache.image.tag }}"
          imagePullPolicy: {{ .Values.cache.image.pullPolicy }}
          args:
            - "redis-server"
            - "--appendonly"
            - "yes"
            - "--dir"
            - "/data"
            - "--maxmemory"
            - "96mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - name: redis
              containerPort: {{ .Values.cache.service.port }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: {{ .Values.cache.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.cache.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.cache.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.cache.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: {{ .Values.cache.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.cache.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.cache.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.cache.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.cache.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "edge-stateful.labels" . | nindent 10 }}
          app.kubernetes.io/component: cache
      spec:
        accessModes:
          {{- toYaml .Values.cache.storage.accessModes | nindent 10 }}
        storageClassName: {{ .Values.cache.storage.className }}
        resources:
          requests:
            storage: {{ .Values.cache.storage.size }}
{{- end }}
