{{/*
The Postgres password Secret.

This chart does NOT ship a credential. If the operator supplies
.postgres.existingSecret we reference it; otherwise Helm generates a random
password at install time with randAlphaNum and stores it in a Secret. The
generated value is never committed to the repo.
*/}}
{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edge-stateful.fullname" . }}-postgres
  labels:
    {{- include "edge-stateful.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
data:
  # key name expected by the StatefulSet below
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
