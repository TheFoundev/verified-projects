# systemd drop-in for the k3s-agent unit.
#
# Install on an agent node with:
#   sudo mkdir -p /etc/systemd/system/k3s-agent.service.d
#   sudo cp systemd/k3s-agent.service.d/override.conf /etc/systemd/system/k3s-agent.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart k3s-agent
#
# On a Raspberry Pi the agent is often the busiest process; keep it alive and
# bound its memory so a misbehaving pod cannot take the whole node down.

[Unit]
StartLimitIntervalSec=0
StartLimitBurst=0

[Service]
Restart=always
RestartSec=10s
TimeoutStartSec=300s
StandardOutput=journal
StandardError=journal
# Guard rail for low-memory edge nodes (Pi 4 with 4GB, small VMs).
MemoryMax=1200M
CPUWeight=150
Environment=K3S_CONFIG_FILE=/etc/rancher/k3s/config.yaml

[Install]
WantedBy=multi-user.target
