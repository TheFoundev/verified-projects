# systemd drop-in for the k3s server unit.
#
# Install on a server node with:
#   sudo mkdir -p /etc/systemd/system/k3s.service.d
#   sudo cp systemd/k3s.service.d/override.conf /etc/systemd/system/k3s.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart k3s
#
# Drop-ins override only the keys you list; the packaged unit still supplies
# everything else. Keep this file free of secrets.

[Unit]
# Give the API server time to settle before dependent units start.
StartLimitIntervalSec=0
# Restart aggressively: an edge node may lose power or network.
StartLimitBurst=0

[Service]
# Restart the server if it exits, with a short backoff.
Restart=always
RestartSec=10s
# Do not let a slow disk or a cold boot kill startup.
TimeoutStartSec=300s
# Route logs through the journal and keep them bounded.
StandardOutput=journal
StandardError=journal
# Resource guard rails so a runaway process cannot starve the control plane
# on a small VM or Pi. Adjust to your hardware.
MemoryMax=1500M
CPUWeight=200
# Environment for the K3s server config file (no secrets here).
Environment=K3S_CONFIG_FILE=/etc/rancher/k3s/config.yaml

[Install]
WantedBy=multi-user.target
