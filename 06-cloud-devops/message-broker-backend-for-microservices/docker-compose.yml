# Local stack: RabbitMQ (quorum queues + Prometheus plugin), the order
# backend, and Prometheus scraping both.
#
#   docker compose up --build
#   curl localhost:8080/health
#   open localhost:9090 (Prometheus) / localhost:15672 (broker UI)

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
      - "15692:15692"   # Prometheus endpoint
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  order-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-backend
    ports:
      - "8080:8080"     # /health /ready /metrics /orders
    environment:
      # mbb_connection turns MBB_* keys into application env overrides.
      MBB_AMQP_HOST: rabbitmq
      MBB_AMQP_PORT: "5672"
      MBB_AMQP_USERNAME: guest
      MBB_AMQP_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - rabbitmq
      - order-backend
