# RabbitMQ node configuration for the message-broker-backend project.
# docker-compose mounts this file at /etc/rabbitmq/rabbitmq.conf.

# AMQP listener
listeners.tcp.default = 5672

# Management UI (http://localhost:15672, guest/guest in dev only)
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Prometheus scrape endpoint, consumed by prometheus/prometheus.yml
prometheus.tcp.port = 15692
prometheus.tcp.ip = 0.0.0.0

# Load the full AMQP topology at boot so a fresh broker is ready before
# the backend's idempotent declarations run (they double as repair).
# Core key; `management.load_definitions` is the deprecated alias.
load_definitions = /etc/rabbitmq/definitions.json

# Keep the container inside predictable memory/disk bounds so
# connection.blocked backpressure is actually exercised.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 2GB

# Local development only: default guest/guest is limited to loopback
# unless loopback_users is empty; docker-compose networking needs it.
loopback_users = none
